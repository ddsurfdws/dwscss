<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DWCSS Basic Example</title>
  <link rel="stylesheet" href="../../core/dw.css">
  <link rel="stylesheet" href="../../core/contracts/dw-palette.css">
  <link rel="stylesheet" href="../../core/contracts/dw-typography.css">
  <link rel="stylesheet" href="../../core/contracts/dw-background.css">
  <link rel="stylesheet" href="../../core/contracts/dw-motion.css">
  <link rel="stylesheet" href="../../core/extensions/dw-layout.css">
</head>
<body>
  <main class="dw-root" data-dw-root>
    <section class="dw-panel">
      <p class="dw-section-kicker">DWCSS Core</p>
      <h1>Structured layout, tokenized skin.</h1>
      <p>DWCSS keeps layout readable while contracts own the visual identity.</p>
    </section>

    <section class="dw-grid dw-cols-24 dw-gap-4">
      <article class="dw-panel dw-span-14">
        <h2>Primary region</h2>
        <p>This area uses layout classes for structure.</p>
      </article>
      <aside class="dw-panel dw-span-10">
        <h2>Secondary region</h2>
        <p>The same structure can wear another contract skin.</p>
      </aside>
    </section>
  </main>
</body>
</html>
